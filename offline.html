<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · GlucoCare</title>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="flex min-h-screen items-center justify-center bg-background px-5 text-foreground">
    <main class="w-full max-w-sm rounded-lg border border-border bg-card p-6 text-center shadow-card">
        <h1 class="text-lg font-semibold">You're offline</h1>
        <p class="mt-2 text-sm leading-relaxed text-muted-foreground">
            GlucoCare needs a connection to save a reading or show your latest numbers.
            Reconnect and try again — nothing you had already saved is lost.
        </p>
        <p class="mt-4 text-xs text-muted-foreground">If this screen stays, check your mobile data or Wi-Fi.</p>
    </main>
</body>
</html>
